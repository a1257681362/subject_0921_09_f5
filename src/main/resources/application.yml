server:
  port: 8080

spring:
  application:
    name: evops-base
  aop:
    proxy-target-class: true
  profiles:
    active: dev
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
  datasource:
    url: jdbc:h2:file:./data/evops;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: false
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 55MB

# 素材多规格转档
asset:
  # 原图与各规格产物的本地落盘根目录
  storage-root: ./data/assets
  # 常规规格：投放信息流的横版 / 竖版两版（宽:高，居中裁切），长边压进限定像素
  specs:
    - name: feed_landscape
      usage: 信息流横版
      ratio: "16:9"
      long-edge: 1280
    - name: feed_portrait
      usage: 信息流竖版
      ratio: "9:16"
      long-edge: 1280
  # 产物体积上限（字节），超标就再压一轮质量
  max-file-size: 300KB
  quality:
    # 首轮质量；每超一轮上限降到下一档，直至下限
    initial: 0.85
    floor: 0.5
    decrement: 0.15

# 年度刊例
rate-card:
  # 默认税率：建刊例版本时未单独指定税率用它（0.06 = 6%）；挂牌单价为未税价
  default-tax-rate: 0.06

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.evops
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.evops: INFO
